# Give the whole window a translucent, blurred backdrop, using the material
# below. See ZenWindowMaterialView in nsCocoaWindow.mm.
- name: zen.widget.macos.window-vibrancy
  value: true
  condition: "defined(XP_MACOSX)"
  cpptype: bool
  mirror: always
  type: static

# 1. hudWindow
# 2. fullScreenUI
# 3. popover
# 4. menu
# 5. toolTip
# 6. headerView
# 7. underlay
- name: zen.widget.macos.window-material
  value: 1
  condition: "defined(XP_MACOSX)"
  cpptype: uint32_t
  mirror: always
  type: static

# Enable native popovers on macOS, we've sent this patch to upstream
# but we enable it by default anyways in case they decide to not use it,
# or to disable it by default.
- name: widget.macos.native-popovers
  value: true
  condition: "defined(XP_MACOSX)"

- name: zen.widget.macos.override-system-swipe-gestures
  value: true
  condition: "defined(XP_MACOSX)"

# Enable visual back/forward gesture capsule indicator on macOS trackpads.
- name: zen.widget.macos.back-gesture-indicator
  value: true
  condition: "defined(XP_MACOSX)"
  cpptype: bool
  mirror: always
  type: static

# Gesture phase published by browser-gestureSupport.js for the native macOS
# scroll monitor (src/zen/gesture/ZenSwipeController.mm): 0 = idle, 1 = a
# back/forward swipe is being tracked, 2 = the held-swipe history sheet is
# visible and the monitor should stream vertical travel to chrome.
- name: zen.widget.macos.back-gesture-phase
  value: 0
  condition: "defined(XP_MACOSX)"

# When true, the native vertical monitor (src/zen/gesture/ZenSwipeController.mm)
# logs every monitor event and every zen-swipe-vertical notification to the system
# log (Console.app, filter on the browser process). Used to trace why the Ardia-style
# hold-to-pick history sheet's vertical selection is not moving. Set true via
# about:config, reproduce the flow, and read the log.
- name: zen.widget.macos.back-gesture-debug
  value: false
  condition: "defined(XP_MACOSX)"
  cpptype: bool
