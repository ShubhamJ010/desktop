name: Build Zen SJ macOS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64

jobs:
  build-macos-zen-sj:
    name: Build Zen macOS SJ - ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (system)
        run: |
          set -uo pipefail
          packages=(
            python3 python3-pip zstd yasm nasm build-essential
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev
            libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev
            libx11-xcb-dev libxt-dev xvfb libvips-dev pkg-config
          )
          apt_opts=(
            -o Acquire::Retries=10
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          # The Ubuntu mirrors occasionally fail DNS resolution on hosted runners
          # ("Temporary failure resolving 'azure.archive.ubuntu.com'"), which used to
          # kill the whole build. Retry the update/install pair a few times instead.
          for attempt in 1 2 3 4 5; do
            sudo apt-get "${apt_opts[@]}" update \
              && sudo apt-get "${apt_opts[@]}" install -y --fix-missing "${packages[@]}" \
              && { echo "System dependencies installed on attempt $attempt"; exit 0; }
            echo "::warning::apt-get failed (attempt $attempt of 5); retrying"
            sudo rm -rf /var/lib/apt/lists/partial
            sleep $((attempt * 15))
          done

          echo "::error::Unable to install system dependencies after 5 attempts"
          exit 1

      - name: Install dependencies (npm)
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            rm -rf node_modules
            sleep 15
          done
          exit 1

      - name: Configure Zen SJ Environment
        run: |
          test -d configs/branding/sj || cp -r configs/branding/release configs/branding/sj
          jq '.appId = "zen-sj" | .updateHostname = "127.0.0.1"' surfer.json > surfer.json.tmp && mv surfer.json.tmp surfer.json

      - name: "Load Surfer CI setup (Brand: sj)"
        run: npm run surfer -- ci --brand sj --display-version "1.24.1b"

      - name: Download Firefox engine and dependencies
        run: npm run download

      - name: mac-cross Cache
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-${{ runner.os }}

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/x86_64-apple-darwin-ld ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source $HOME/.cargo/env
          rustup target add ${{ inputs.arch }}-apple-darwin

      - name: Import & Apply Zen Patches
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          SURFER_PLATFORM: darwin
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          export SURFER_PLATFORM="darwin"
          npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Compile Zen Browser (Production macOS Release Build)
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          ZEN_RELEASE_BRANCH: release
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: 1
          ZEN_GA_DISABLE_PGO: 1
        run: |
          set -x
          bash .github/workflows/src/release-build.sh

      - name: Configure Bundle Identity & Disable Updates in App Bundle
        run: |
          set -x
          tpl="engine/browser/app/macbuild/Contents"
          mkdir -p "$tpl/Resources/distribution" "$tpl/Resources/defaults/pref"
          cat << 'EOF' > "$tpl/Resources/distribution/policies.json"
          {
            "policies": {
              "DisableAppUpdate": true,
              "ManualAppUpdateOnly": true
            }
          }
          EOF
          printf '%s\n' \
            'pref("app.update.auto", false);' \
            'pref("app.update.enabled", false);' \
            'pref("app.update.background.scheduling.enabled", false);' \
            > "$tpl/Resources/defaults/pref/zen-sj-no-update.js"

          # Remove updater binary
          find engine/obj-*/dist/bin/updater.app -type f -name "org.mozilla.updater" -delete 2>/dev/null || true

          # Inject dummy update URL
          find engine/obj-*/dist -name "application.ini" -exec sed -i 's|^URL=https://updates.zen-browser.app.*|URL=http://127.0.0.1/no-update|g' {} + 2>/dev/null || true

      - name: Package DMG (Zen SJ)
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          ZEN_GA_DISABLE_PGO: true
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: 1
          ZEN_RELEASE: 1
        run: |
          set -x
          npm run package

      - name: Verify Bundle Integrity
        run: |
          app="$(find engine/obj-*/dist -maxdepth 1 -name "*.app" -type d | head -1)"
          test -n "$app"
          echo "Packaged app bundle: $app"
          if [ -f "$app/Contents/MacOS/updater.app/Contents/MacOS/org.mozilla.updater" ]; then
            echo "::error::updater binary still present in the packaged app"
            exit 1
          fi
          if [ -f "$app/Contents/Resources/distribution/policies.json" ]; then
            echo "policies.json successfully verified in $app"
          else
            echo "::error::missing distribution/policies.json"
            exit 1
          fi

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          mv ./dist/*.dmg ./output/Zen-SJ-macOS-${{ inputs.arch }}.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zen-SJ-macOS-${{ inputs.arch }}
          path: ./output/Zen-SJ-macOS-${{ inputs.arch }}.dmg
          retention-days: 14
