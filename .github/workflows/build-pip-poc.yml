name: Build Zen macOS (POC)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64

jobs:
  build-macos-zen:
    name: Build Zen macOS - ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential \
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev \
            libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev xvfb libvips-dev pkg-config --fix-missing

      - name: Install dependencies (npm)
        run: |
          # sharp (pulled in by surfer) downloads a prebuilt libvips from GitHub
          # releases. That download regularly 504s on shared runners. libvips-dev
          # is installed above so sharp's source fallback compiles, and a retry
          # covers the transient failure before it gets there.
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            rm -rf node_modules
            sleep 15
          done
          exit 1

      - name: Configure POC Environment (Side-by-Side & Anti-Auto-Update)
        run: |
          # Isolate profile to zen-custom so POC does not collide with user's official Zen profile
          # Also point updateHostname to 127.0.0.1 to kill update checks at build time
          jq '.appId = "zen-custom" | .updateHostname = "127.0.0.1"' surfer.json > surfer.json.tmp && mv surfer.json.tmp surfer.json

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "1.24.1b-pip"

      - name: Download Firefox engine and dependencies
        run: npm run download

      - name: mac-cross Cache
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-${{ runner.os }}

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/x86_64-apple-darwin-ld ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source $HOME/.cargo/env
          rustup target add ${{ inputs.arch }}-apple-darwin

      - name: Import & Apply Zen Patches
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          SURFER_PLATFORM: darwin
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          export SURFER_PLATFORM="darwin"
          npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Compile Zen Browser (Cross-compile macOS)
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          ZEN_RELEASE_BRANCH: release
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: 1
          ZEN_GA_DISABLE_PGO: 1
        run: |
          set -x
          bash .github/workflows/src/release-build.sh

      - name: Disable Auto-Updates in POC App Bundle
        run: |
          set -x
          # `surfer package` re-runs `mach package`, which rebuilds dist/Zen.app from
          # the macOS bundle template. Injecting into dist/Zen.app before packaging is
          # therefore wiped. The template survives:
          tpl="engine/browser/app/macbuild/Contents"
          mkdir -p "$tpl/Resources/distribution" "$tpl/Resources/defaults/pref"
          echo '{"policies":{"DisableAppUpdate":true}}' > "$tpl/Resources/distribution/policies.json"
          printf '%s\n' \
            'pref("app.update.auto", false);' \
            'pref("app.update.enabled", false);' \
            'pref("app.update.background.scheduling.enabled", false);' \
            > "$tpl/Resources/defaults/pref/pip-poc-no-update.js"

          # Belt and braces: the updater binary is copied verbatim from
          # dist/bin/updater.app into the packaged app. Remove it so a MAR that does
          # get downloaded can never be applied.
          find engine/obj-*/dist/bin/updater.app -type f -name "org.mozilla.updater" -delete

      - name: Package DMG
        env:
          SURFER_COMPAT: ${{ inputs.arch }}
          ZEN_GA_DISABLE_PGO: true
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: 1
          ZEN_RELEASE: 1
        run: |
          set -x
          npm run package

      - name: Verify POC bundle cannot self-update
        run: |
          app="$(find engine/obj-*/dist -maxdepth 1 -name Zen.app -type d | head -1)"
          test -n "$app"
          if [ -f "$app/Contents/MacOS/updater.app/Contents/MacOS/org.mozilla.updater" ]; then
            echo "::error::updater binary still present in the packaged app"
            exit 1
          fi
          if [ -f "$app/Contents/Resources/distribution/policies.json" ]; then
            echo "policy present in the packaged app"
          else
            echo "::warning::no distribution/policies.json in the packaged app; the removed updater is the only guard"
          fi

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          mv ./dist/*.dmg ./output/Zen-macOS-${{ inputs.arch }}.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zen-macOS-${{ inputs.arch }}
          path: ./output/Zen-macOS-${{ inputs.arch }}.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: false
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.24.1b-poc
          name: "Zen macOS POC (${{ inputs.arch }})"
          files: ./output/Zen-macOS-${{ inputs.arch }}.dmg
          draft: false
          prerelease: true
