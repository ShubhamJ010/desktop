name: RC macOS build

# Release-channel macOS build for this fork.
# Cross-compiles on Linux (Ubuntu 24.04), codesigns with rcodesign,
# and publishes release zip to GitHub + updates Homebrew tap.
#
# No macOS runners needed for packaging or publishing.
# No MAR signing or GitHub Pages manifests.
# Updates are managed cleanly via Homebrew Cask.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag to build (default: latest zen-browser/desktop release)"
        required: false
        type: string
      branch:
        description: "Branch to merge upstream into and build"
        required: false
        type: string
        default: "zen-enh-main"
      force:
        description: "Rebuild even if a release with this tag already exists"
        required: false
        type: boolean
        default: false
      disable_pgo:
        description: "Build without PGO (skips profile generation and uses no profile)"
        required: false
        type: boolean
        default: false

concurrency:
  group: rc-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  ARCH: aarch64

jobs:
  detect:
    name: Resolve upstream release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_id: ${{ steps.meta.outputs.build_id }}
      build: ${{ steps.meta.outputs.build }}
      pgo: ${{ steps.meta.outputs.pgo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve version and decide whether to build
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DISABLE_PGO: ${{ inputs.disable_pgo }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(gh api repos/zen-browser/desktop/releases/latest --jq .tag_name)
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve an upstream release tag"
            exit 1
          fi

          build=true
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$INPUT_FORCE" != "true" ]; then
              echo "Release $version already exists in $GITHUB_REPOSITORY; nothing to do"
              build=false
            fi
          fi

          # Skipping PGO on schedules or explicit opt-out to conserve resources
          pgo=true
          if [ "$INPUT_DISABLE_PGO" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            pgo=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "pgo=$pgo" >> "$GITHUB_OUTPUT"
          echo "Target: $version, build=$build, pgo=$pgo"

  sync:
    name: Sync upstream dev
    needs: [detect]
    if: ${{ needs.detect.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      firefox: ${{ steps.pgo.outputs.firefox }}
      pgo_key: ${{ steps.pgo.outputs.pgo_key }}
      pgo_hit: ${{ steps.cache.outputs.hit }}

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.branch || 'zen-enh-main' }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream dev
        id: merge
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/zen-browser/desktop.git dev
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already contains upstream dev"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit FETCH_HEAD; then
              echo "::error::Upstream merge conflicts. Resolve locally, then rerun:"
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: npm ci

      - name: Download Firefox engine
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: npm run download

      - name: Verify patches apply
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: npm run import

      - name: Drop validation changes
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: git reset --hard HEAD

      - name: Push merged branch
        if: ${{ steps.merge.outputs.changed == 'true' }}
        env:
          BRANCH: ${{ inputs.branch || 'zen-enh-main' }}
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

      - name: Compute PGO cache key
        id: pgo
        run: |
          set -euo pipefail
          firefox=$(node -p "require('./surfer.json').version.version")
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          echo "pgo_key=rc-profdata-ff${firefox}-${{ hashFiles('src/zen/common/sys/ZenPGOTraining.sys.mjs', 'src/build/pgo/profileserver-py.patch', 'src/testing/profiles/profileserver/user-js.patch') }}-aarch64" >> "$GITHUB_OUTPUT"

      - name: Look up cached PGO profile
        id: pgo-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.pgo.outputs.pgo_key }}
          path: ~/artifact
          lookup-only: true

      - name: Report cache state
        id: cache
        run: |
          hit="${{ steps.pgo-cache.outputs.cache-hit }}"
          if [ "$hit" = "true" ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi

  pgo-stage1:
    name: PGO stage 1 (instrumented)
    needs: [detect, sync]
    if: ${{ needs.detect.outputs.build == 'true' && needs.sync.outputs.pgo_hit != 'true' && needs.detect.outputs.pgo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          set -euo pipefail
          swap=/swapfile-rc
          sudo rm -f "$swap"
          sudo fallocate -l 16G "$swap" \
            || sudo dd if=/dev/zero of="$swap" bs=1M count=16384 status=none
          sudo chmod 600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          free -h
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libasound2-dev libcurl4-openssl-dev libdbus-1-dev \
            libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev \
            libxt-dev nasm xvfb libx11-dev yasm libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libpci-dev clang llvm libclang-dev clang-format \
            libxcb-shm0-dev libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Load surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "${{ needs.detect.outputs.version }}"

      - name: Download Firefox engine
        run: npm run download

      - name: Restore macOS cross toolchain
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-linux64

      - name: Setup macOS cross toolchain
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin

      - name: Import patches
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          . "$HOME/.cargo/env"
          npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Prepare object directory
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          . "$HOME/.cargo/env"
          mkdir -p engine/obj-aarch64-apple-darwin
          npm run moz-build-dir -- configs/common/mozconfig.pgo-stage-1 engine/obj-aarch64-apple-darwin

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build instrumented binaries
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          export CCTOOLS_PATH="$HOME/mac-cross/cctools/bin"
          . "$HOME/.cargo/env"
          cd engine
          ./mach build -v

      - name: Package instrumented DMG
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          . "$HOME/.cargo/env"
          npm run package -- --verbose
          mv dist/zen.dmg ../zen-rc-pgo-stage1-aarch64.dmg

      - name: Upload instrumented build
        uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: rc-pgo-stage1-aarch64
          path: ./zen-rc-pgo-stage1-aarch64.dmg

  pgo-profile:
    name: PGO profile data (macOS)
    needs: [detect, sync, pgo-stage1]
    if: ${{ needs.detect.outputs.build == 'true' && needs.sync.outputs.pgo_hit != 'true' && needs.detect.outputs.pgo == 'true' }}
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install npm dependencies
        run: npm ci

      - name: Load surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "${{ needs.detect.outputs.version }}"

      - name: Download instrumented app
        uses: actions/download-artifact@v4
        with:
          path: ~/instrumented
          name: rc-pgo-stage1-aarch64

      - name: Download Firefox engine
        run: npm run download

      - name: Import patches
        env:
          SURFER_NO_BRANDING_PATCH: "true"
        run: npm run import

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM=darwin
          ./mach --no-interactive bootstrap --application-choice browser --exclude macos-sdk || true

      - name: Extract and sign instrumented app
        run: |
          set -ex
          cd engine
          ./mach python -m mozbuild.action.unpack_dmg \
            "$HOME/instrumented/zen-rc-pgo-stage1-aarch64.dmg" \
            "$HOME/instrumented/app"
          app=$(find "$HOME/instrumented/app" -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$app"
          codesign --force --deep --sign - "$app"

      - name: Generate PGO profile
        run: |
          set -ex
          export LLVM_PROFDATA="$HOME/.mozbuild/clang/bin/llvm-profdata"
          export JARLOG_FILE=en-US.log
          binary=$(find "$HOME/instrumented" -type f -path "*/Contents/MacOS/zen" | head -1)
          test -n "$binary"
          cd engine
          ./mach python ../scripts/download_pgo_extended_corpus.py
          ./mach python ../scripts/generate_pgo_profile.py --binary "$binary" --corpus-dir ../pgo-corpus/extended

      - name: Save profile data
        run: |
          set -ex
          mkdir -p ~/artifact
          cp engine/merged.profdata ~/artifact/
          if [ -f engine/en-US.log ]; then
            cp engine/en-US.log ~/artifact/
          fi
          ls -la ~/artifact

      - name: Cache profile data
        uses: actions/cache/save@v4
        with:
          key: ${{ needs.sync.outputs.pgo_key }}
          path: ~/artifact

  build:
    name: ${{ needs.detect.outputs.pgo == 'true' && 'PGO stage 3 (release build)' || 'Release build (no PGO)' }}
    needs: [detect, sync, pgo-profile]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.build == 'true' && (needs.detect.outputs.pgo == 'false' || needs.sync.outputs.pgo_hit == 'true' || needs.pgo-profile.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          set -euo pipefail
          swap=/swapfile-rc
          sudo rm -f "$swap"
          sudo fallocate -l 16G "$swap" \
            || sudo dd if=/dev/zero of="$swap" bs=1M count=16384 status=none
          sudo chmod 600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          free -h
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libasound2-dev libcurl4-openssl-dev libdbus-1-dev \
            libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev \
            libxt-dev nasm xvfb libx11-dev yasm libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libpci-dev clang llvm libclang-dev clang-format \
            libxcb-shm0-dev libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Load surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "${{ needs.detect.outputs.version }}"

      - name: Download Firefox engine
        run: npm run download

      - name: Restore macOS cross toolchain
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-linux64

      - name: Setup macOS cross toolchain
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin

      - name: Import patches
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          . "$HOME/.cargo/env"
          npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Restore profile data (cache)
        if: ${{ needs.detect.outputs.pgo == 'true' && needs.sync.outputs.pgo_hit == 'true' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ needs.sync.outputs.pgo_key }}
          path: ~/artifact
          fail-on-cache-miss: true

      - name: Prepare object directory
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          . "$HOME/.cargo/env"
          mkdir -p engine/obj-aarch64-apple-darwin
          if [ "${{ needs.detect.outputs.pgo }}" = "true" ]; then
            cp ~/artifact/merged.profdata engine/obj-aarch64-apple-darwin/merged.profdata
            if [ -f ~/artifact/en-US.log ]; then
              cp ~/artifact/en-US.log engine/en-US.log
            fi
            npm run moz-build-dir -- configs/common/mozconfig.pgo-stage-2 engine/obj-aarch64-apple-darwin
          else
            npm run moz-build-dir -- configs/macos/mozconfig.release engine/obj-aarch64-apple-darwin
          fi

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build release binaries
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          export CCTOOLS_PATH="$HOME/mac-cross/cctools/bin"
          . "$HOME/.cargo/env"
          cd engine
          ./mach build -v

      - name: Package app bundle
        env:
          SURFER_COMPAT: aarch64
          SURFER_PLATFORM: darwin
        run: |
          set -ex
          export PATH="$HOME/mac-cross/cctools/bin:$HOME/mac-cross/dmg:$HOME/mac-cross/hfsplus:$PATH"
          export PATH="$HOME/.mozbuild/clang/bin:$PATH"
          . "$HOME/.cargo/env"
          npm run package -- --verbose

      - name: Stage app bundle and platform.ini
        run: |
          set -ex
          obj="engine/obj-aarch64-apple-darwin"
          app="$obj/dist/zen/Zen.app"
          if [ ! -d "$app" ]; then
            app=$(find "$obj/dist" -maxdepth 2 -name "*.app" -type d ! -path "*/dist/bin/*" | head -1)
          fi
          test -d "$app"
          echo "App bundle: $app"

          # Disable in-app updater (updates managed via Homebrew Cask)
          resources="$app/Contents/Resources"
          mkdir -p "$resources/distribution" "$resources/defaults/pref"
          printf '{\n  "policies": {\n    "DisableAppUpdate": true,\n    "ManualAppUpdateOnly": true,\n    "BackgroundAppUpdate": false,\n    "AppAutoUpdate": false\n  }\n}\n' > "$resources/distribution/policies.json"
          printf 'pref("app.update.auto", false);\npref("app.update.enabled", false);\n' > "$resources/defaults/pref/channel-prefs.js"

          rm -f zen-rc-unsigned-app.zip
          (cd "$(dirname "$app")" && zip -q -r -y "$GITHUB_WORKSPACE/zen-rc-unsigned-app.zip" "$(basename "$app")")
          cp "$obj/dist/bin/platform.ini" ./platform.ini
          echo "App: $(du -h zen-rc-unsigned-app.zip | cut -f1)"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: rc-app-aarch64
          path: |
            zen-rc-unsigned-app.zip
            platform.ini

  package:
    name: Codesign app
    needs: [detect, sync, build]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: rc-app-aarch64
          path: ~/app-artifact

      - name: Install rcodesign
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo mv apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/
          rcodesign --version

      - name: Extract and codesign app
        env:
          P12_BASE64: ${{ secrets.ZEN_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ZEN_CODESIGN_P12_PASSWORD }}
        run: |
          set -ex
          unzip -q -o "$HOME/app-artifact/zen-rc-unsigned-app.zip" -d app-root
          app=$(find app-root -maxdepth 2 -name "*.app" -type d | head -1)
          test -d "$app"

          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > cert.p12
            rcodesign sign --p12-file cert.p12 --p12-password "$P12_PASSWORD" --code-signature-flags runtime "$app"
            rm -f cert.p12
            rcodesign verify "$app"
          else
            echo "No codesigning cert configured, ad-hoc signing"
            rcodesign sign "$app"
          fi

          (cd "$(dirname "$app")" && zip -q -r -y "$GITHUB_WORKSPACE/zen-rc-macos-aarch64.zip" "$(basename "$app")")

      - name: Upload signed app bundle
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: rc-macos-app
          path: ./zen-rc-macos-aarch64.zip

  publish:
    name: Publish release and update tap
    needs: [detect, sync, build, package]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.build == 'true' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download signed app
        uses: actions/download-artifact@v4
        with:
          name: rc-macos-app
          path: ~/signed-app

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          FIREFOX: ${{ needs.sync.outputs.firefox }}
          COMMIT: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          app_zip="$HOME/signed-app/zen-rc-macos-aarch64.zip"
          test -f "$app_zip"

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$app_zip"
            exit 0
          fi

          printf 'RC build for upstream Zen %s, Firefox %s.\n\nCommit: %s\nmacOS arm64, Homebrew cask distribution.\n\nInstall with Homebrew:\n```bash\nbrew tap ShubhamJ010/tap\nbrew install --cask zen-browser-rc\n```\n' "$VERSION" "$FIREFOX" "$COMMIT" > notes.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RC build $VERSION" \
            --notes-file notes.md \
            --prerelease \
            "$app_zip"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN secret not set; skipping automatic Homebrew tap bump."
            exit 0
          fi

          app_zip="$HOME/signed-app/zen-rc-macos-aarch64.zip"
          SHA256=$(sha256sum "$app_zip" | awk '{print $1}')
          echo "Bumping tap to $VERSION ($SHA256)..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ShubhamJ010/homebrew-tap.git" tap
          cd tap
          CASK="Casks/zen-browser-rc.rb"
          if [ -f "$CASK" ]; then
            python3 -c "import os, re; from pathlib import Path; p = Path('$CASK'); c = p.read_text(); c = re.sub(r'version\s+\"[^\"]+\"', f'version \"{os.environ[\"VERSION\"]}\"', c, count=1); c = re.sub(r'sha256\s+\"[^\"]+\"', f'sha256 \"{os.environ[\"SHA256\"]}\"', c, count=1); c = re.sub(r'sha256\s+:no_check', f'sha256 \"{os.environ[\"SHA256\"]}\"', c, count=1); p.write_text(c)"
            git add "$CASK"
            if ! git diff --cached --quiet; then
              git commit -m "chore(cask): bump zen-browser-rc to $VERSION"
              git push origin main
              echo "Homebrew tap updated!"
            else
              echo "Cask already up to date."
            fi
          fi
